[project]
name = "dyxgb"
version = "0.3.0"
description = "Dynamic XGBoost - A flexible CLI tool for XGBoost training and prediction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sxndmxn" }]
keywords = ["xgboost", "machine-learning", "cli", "data-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core ML
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",

    # Data handling
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.0.0",

    # Config & Serialization
    "pyyaml>=6.0.0",
    "joblib>=1.3.0",

    # Database support
    "duckdb>=0.10.0",
    "connectorx>=0.3.0",
]

[project.optional-dependencies]
interactive = ["inquirerpy>=0.3.4"]
postgres = ["psycopg2-binary>=2.9.0"]
tuning = ["optuna>=3.5.0"]
all = [
    "inquirerpy>=0.3.4",
    "psycopg2-binary>=2.9.0",
    "optuna>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
dyxgb = "dyxgb.cli:app"

[project.urls]
Homepage = "https://github.com/sxndmxn/dyxgb"
Repository = "https://github.com/sxndmxn/dyxgb"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dyxgb"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N803", "N806"]  # Allow uppercase X, X_train etc (ML convention)

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_ignores = false
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "dyxgb.transforms.*",
    "dyxgb.config",
    "dyxgb.data.*",
    "dyxgb.evaluation.*",
    "dyxgb.interactive",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=dyxgb"
