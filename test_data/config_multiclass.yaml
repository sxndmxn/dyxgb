# Multi-class classification configuration
# Tests 5-class classification

data:
  train:
    type: file
    path: "test_data/multiclass_classification.parquet"

model:
  task: classification
  target: label
  features: []
  
  hyperparameters:
    n_estimators: 150
    max_depth: 6
    learning_rate: 0.1
    random_state: 42
  
  validation_split: 0.2
  early_stopping_rounds: 15

tuning:
  enabled: false

output:
  model_path: "test_data/models/multiclass_model.json"
  encoder_path: "test_data/models/multiclass_encoder.joblib"
  predictions_path: "test_data/output/multiclass_predictions.parquet"

evaluation:
  show_metrics: true
  metrics:
    - accuracy
    - precision
    - recall
    - f1
