# Basic classification configuration
# Simple CSV training without transforms

data:
  train:
    type: file
    path: "test_data/classification_train.csv"
  predict:
    type: file
    path: "test_data/classification_test.csv"

model:
  task: classification
  target: label
  # Auto-detect features (all columns except target)
  features: []
  
  hyperparameters:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    random_state: 42
  
  validation_split: 0.2
  early_stopping_rounds: 10

tuning:
  enabled: false

output:
  model_path: "test_data/models/classification_basic_model.json"
  encoder_path: "test_data/models/classification_basic_encoder.joblib"
  pipeline_path: "test_data/models/classification_basic_pipeline.joblib"
  predictions_path: "test_data/output/classification_basic_predictions.parquet"

evaluation:
  show_metrics: true
  show_importance: true
  importance_type: gain
  top_n_features: 10
